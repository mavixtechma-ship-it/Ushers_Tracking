# Builds the Angular app and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The site is served from https://<user>.github.io/Ushers_Tracking/
      - run: npx ng build --configuration production --base-href /Ushers_Tracking/

      # SPA fallback: unknown paths (deep links / refresh) load the app instead of a 404,
      # and .nojekyll stops Pages from dropping files that start with "_".
      - name: Prepare Pages output
        run: |
          cp dist/fieldpulse/browser/index.html dist/fieldpulse/browser/404.html
          touch dist/fieldpulse/browser/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/fieldpulse/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
